- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceLobot
  categories: [ HideSpawnMenu ]
  name: lobot appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganHumanTorso
      Head: OrganHumanHead
      ArmLeft: OrganHumanArmLeft
      ArmRight: OrganHumanArmRight
      HandRight: OrganHumanHandRight
      HandLeft: OrganHumanHandLeft
      LegLeft: OrganHumanLegLeft
      LegRight: OrganHumanLegRight
      FootLeft: OrganHumanFootLeft
      FootRight: OrganHumanFootRight
      Brain: MobLobotBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Lobot

- type: entity
  parent:
  - AppearanceLobot
  - BaseSpeciesMobOrganic
  id: MobLobotChassis
  name: USB McHalite
  components:
  - type: LobotBrainRemove
  - type: LobotBrainContainer

- type: entity # this is my prototype. it has every disease
  name: lobot brain
  parent: [BaseControllable, BaseItem, OrganBaseChildInternal]
  id: MobLobotBrain
  description: ew.
  components:
  - type: GibbableOrgan
  - type: LobotBrainBoard
  - type: LobotBrain
  - type: Brain
  - type: Organ
    category: Brain
  - type: InputMover
  - type: MobMover
  - type: Puller
    needsHands: false
  - type: Sprite
    drawdepth: SmallMobs
    sprite: Mobs/Species/Human/organs.rsi
    layers:
      - state: brain
  - type: MobState
  - type: Deathgasp
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
      - ActionCritFakeDeath
      - ActionCritLastWords
  - type: MobThresholds
    thresholds:
      0: Alive
      10: Critical
      20: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 5
  - type: FlavorProfile
    flavors:
    - meaty
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.1
  - type: Vocal
    emoteSounds: UnisexKodepiia
  - type: CombatMode
  - type: Physics
    bodyType: KinematicController